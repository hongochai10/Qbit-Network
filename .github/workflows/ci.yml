name: QBit Network CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install liboqs
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc ninja-build
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs && mkdir build && cd build
          cmake -GNinja -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=$HOME/_oqs ..
          ninja && ninja install
          echo "LD_LIBRARY_PATH=$HOME/_oqs/lib" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install liboqs-python cryptography aiohttp pytest pytest-asyncio pytest-timeout

      - name: Run unit tests
        run: |
          python -m pytest tests/test_crypto.py tests/test_transaction.py tests/test_block.py tests/test_wallet.py tests/test_blockchain.py -v --tb=short --junitxml=unit-results.xml

      - name: Import check
        run: python -c "from qbit_network.node import FullNode; print('Import OK')"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: unit-results.xml

  adversarial-tests:
    name: Adversarial Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install liboqs
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc ninja-build
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs && mkdir build && cd build
          cmake -GNinja -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=$HOME/_oqs ..
          ninja && ninja install
          echo "LD_LIBRARY_PATH=$HOME/_oqs/lib" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install liboqs-python cryptography aiohttp pytest pytest-asyncio pytest-timeout

      - name: Run adversarial tests
        run: |
          python -m pytest tests/test_adversarial.py -v --tb=short --junitxml=adversarial-results.xml

      - name: Upload adversarial test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-test-results-py${{ matrix.python-version }}
          path: adversarial-results.xml

  integration-tests:
    name: Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install liboqs
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc ninja-build
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs && mkdir build && cd build
          cmake -GNinja -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=$HOME/_oqs ..
          ninja && ninja install
          echo "LD_LIBRARY_PATH=$HOME/_oqs/lib" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install liboqs-python cryptography aiohttp pytest pytest-asyncio pytest-timeout

      - name: Run integration tests
        run: |
          python -m pytest tests/test_integration.py tests/test_v020_features.py -v --tb=short --junitxml=integration-results.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-py${{ matrix.python-version }}
          path: integration-results.xml

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, adversarial-tests, integration-tests]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Test Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Adversarial Tests | ${{ needs.adversarial-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All three test suites ran in parallel across Python 3.11 and 3.12." >> $GITHUB_STEP_SUMMARY
