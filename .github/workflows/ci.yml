name: QBit Network CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check qbit_network/ sdk/ tests/ --output-format=github

      - name: Run ruff format check
        run: ruff format --check qbit_network/ sdk/ tests/

  core-tests:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install liboqs
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc ninja-build
          git clone --depth 1 --branch 0.15.0 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs && mkdir build && cd build
          cmake -GNinja -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=$HOME/_oqs ..
          ninja && ninja install
          echo "LD_LIBRARY_PATH=$HOME/_oqs/lib" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock

      - name: Run core tests
        run: |
          python -m pytest tests/test_crypto.py tests/test_transaction.py tests/test_block.py tests/test_wallet.py tests/test_blockchain.py tests/test_state_trie.py tests/test_store.py tests/test_proof.py tests/test_secure_bytes.py tests/test_revoke_key.py tests/test_reputation_pruning_proof.py -x -v --tb=short --junitxml=core-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results-py${{ matrix.python-version }}
          path: core-results.xml

