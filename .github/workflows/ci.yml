  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install liboqs
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc ninja-build
          git clone --depth 1 --branch 0.15.0 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs && mkdir build && cd build
          cmake -GNinja -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=$HOME/_oqs ..
          ninja && ninja install
          echo "LD_LIBRARY_PATH=$HOME/_oqs/lib" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=qbit_network \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=90 \
            -v --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install liboqs
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc ninja-build
          git clone --depth 1 --branch 0.15.0 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs && mkdir build && cd build
          cmake -GNinja -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=$HOME/_oqs ..
          ninja && ninja install
          echo "LD_LIBRARY_PATH=$HOME/_oqs/lib" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock

      - name: Run performance benchmark (CI gate level)
        run: |
          python -m benchmarks.bench_production_load --levels 100 --output-dir benchmarks/results
          # Parse JSON results and fail if TX throughput drops below threshold
          python3 -c "
          import json, glob, sys
          files = sorted(glob.glob('benchmarks/results/bench_*.json'))
          if not files:
              print('ERROR: No benchmark results found')
              sys.exit(1)
          with open(files[-1]) as f:
              data = json.load(f)
          for r in data['results']:
              tps = r.get('tx_per_sec', 0)
              sign_ops = r.get('mldsa_sign_ops_sec', 0)
              verify_ops = r.get('mldsa_verify_ops_sec', 0)
              print(f'Level {r[\"level\"]}: TX/s={tps:.0f}, Sign={sign_ops:.0f} ops/s, Verify={verify_ops:.0f} ops/s')
              if sign_ops < 50:
                  print(f'FAIL: ML-DSA sign throughput too low ({sign_ops:.0f} < 50 ops/s)')
                  sys.exit(1)
              if verify_ops < 100:
                  print(f'FAIL: ML-DSA verify throughput too low ({verify_ops:.0f} < 100 ops/s)')
                  sys.exit(1)
          print('Benchmark gate PASSED')
          "

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t qbit-network:ci-test .

      - name: Smoke test — container starts and health check passes
        run: |
          docker run -d --name qbit-smoke \
            -p 8545:8545 -p 9000:9000 \
            qbit-network:ci-test
          # Wait for container to be healthy (up to 60s)
          for i in $(seq 1 12); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' qbit-smoke 2>/dev/null || echo "starting")
            echo "Health check attempt $i: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Container is healthy!"
              break
            fi
            if [ "$i" = "12" ]; then
              echo "FAIL: Container did not become healthy within 60s"
              docker logs qbit-smoke
              docker stop qbit-smoke && docker rm qbit-smoke
              exit 1
            fi
            sleep 5
          done
          # Verify RPC endpoint responds
          curl -sf http://localhost:8545/api/v1/health || {
            echo "FAIL: Health endpoint not responding"
            docker logs qbit-smoke
            docker stop qbit-smoke && docker rm qbit-smoke
            exit 1
          }
          echo "Docker smoke test PASSED"
          docker stop qbit-smoke && docker rm qbit-smoke

      - name: Report image size
        run: |
          SIZE=$(docker image inspect qbit-network:ci-test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Docker image size: ${SIZE_MB}MB"
          echo "## Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "Size: ${SIZE_MB}MB" >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scan tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit detect-secrets

      - name: Run bandit (SAST)
        run: |
          bandit -r qbit_network/ sdk/ -f json -o bandit-results.json --severity-level medium || true
          bandit -r qbit_network/ sdk/ -f txt --severity-level high
        # Fail on high-severity only; medium reported but non-blocking

      - name: Run pip-audit (dependency CVE scan)
        run: |
          pip install -r requirements.lock
          pip-audit --format json --output pip-audit-results.json || true
          pip-audit --desc

      - name: Run detect-secrets (secret scan)
        run: |
          detect-secrets scan --all-files --exclude-files '\.lock$' > secrets-results.json
          python -c "
          import json, sys
          with open('secrets-results.json') as f:
              data = json.load(f)
          results = data.get('results', {})
          total = sum(len(v) for v in results.values())
          if total > 0:
              print(f'WARNING: {total} potential secret(s) detected:')
              for path, findings in results.items():
                  for f_item in findings:
                      print(f'  {path}:{f_item[\"line_number\"]} — {f_item[\"type\"]}')
          else:
              print('No secrets detected.')
          "

      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            bandit-results.json
            pip-audit-results.json
            secrets-results.json

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, core-tests, financial-tests, consensus-tests, network-tests, feature-tests, adversarial-tests, integration-tests, coverage, security-scan, benchmark, docker-build]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Test Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint (ruff) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Core Tests | ${{ needs.core-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Financial Tests | ${{ needs.financial-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Consensus Tests | ${{ needs.consensus-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Network Tests | ${{ needs.network-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Feature Tests | ${{ needs.feature-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Adversarial Tests | ${{ needs.adversarial-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Gate (≥90%) | ${{ needs.coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Benchmark | ${{ needs.benchmark.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build & Smoke Test | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All test suites ran in parallel across Python 3.11 and 3.12 (14 jobs + coverage gate + security scan + benchmark + Docker build)." >> $GITHUB_STEP_SUMMARY
