      - name: Run financial tests
        run: |
          python -m pytest tests/test_financial.py tests/test_financial_adversarial.py tests/test_sprint2_financial.py tests/test_eip1559.py tests/test_tokens.py -x -v --tb=short --junitxml=financial-results.xml

      - name: Upload test results
        if: always()
