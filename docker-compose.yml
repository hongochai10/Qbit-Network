version: "3.8"

# QBit Network 3-validator testnet
# Usage:
#   cp .env.example .env   # set your own tokens
#   docker-compose up -d
# RPC: http://localhost:8545 (node1), :8546 (node2), :8547 (node3)

services:
  node1:
    build: .
    container_name: qbit-node1
    command: >
      --data-dir /data
      --p2p-port 9000 --rpc-port 8545
      --peers node2:9000 node3:9000
      --rpc-token ${RPC_TOKEN_1:?Set RPC_TOKEN_1 in .env}
    ports:
      - "8545:8545"
      - "9000:9000"
    volumes:
      - node1-data:/data
    environment:
      - QBIT_ALLOW_PRIVATE_PEERS=1
    networks:
      - qbit-net

  node2:
    build: .
    container_name: qbit-node2
    command: >
      --data-dir /data
      --p2p-port 9000 --rpc-port 8545
      --peers node1:9000 node3:9000
      --rpc-token ${RPC_TOKEN_2:?Set RPC_TOKEN_2 in .env}
    ports:
      - "8546:8545"
      - "9001:9000"
    volumes:
      - node2-data:/data
    environment:
      - QBIT_ALLOW_PRIVATE_PEERS=1
    networks:
      - qbit-net

  node3:
    build: .
    container_name: qbit-node3
    command: >
      --data-dir /data
      --p2p-port 9000 --rpc-port 8545
      --peers node1:9000 node2:9000
      --rpc-token ${RPC_TOKEN_3:?Set RPC_TOKEN_3 in .env}
    ports:
      - "8547:8545"
      - "9002:9000"
    volumes:
      - node3-data:/data
    environment:
      - QBIT_ALLOW_PRIVATE_PEERS=1
    networks:
      - qbit-net

volumes:
  node1-data:
  node2-data:
  node3-data:

networks:
  qbit-net:
    driver: bridge
